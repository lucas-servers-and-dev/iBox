<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoxCloud - Glass Edition</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.12);
      --glass-bg-hover: rgba(255, 255, 255, 0.22);
      --glass-border: rgba(255, 255, 255, 0.25);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.75);
      --accent: #007aff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #0f0c20; color: var(--text-main); height: 100vh; display: flex; overflow: hidden; position: relative; }

    .bg-shape { position: absolute; border-radius: 50%; filter: blur(90px); z-index: 0; }
    .shape1 { width: 300px; height: 300px; background: #7928ca; top: -50px; left: -50px; }
    .shape2 { width: 300px; height: 300px; background: #0070f3; bottom: -50px; right: -50px; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(15px); display: flex; justify-content: center; align-items: center; z-index: 1000;
      padding: 20px;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border); border-radius: 24px; padding: 2rem; width: 100%; max-width: 400px; text-align: center;
    }

    .glass-input {
      width: 100%; background: rgba(255, 255, 255, 0.1); border: 1px solid var(--glass-border);
      padding: 14px; border-radius: 12px; color: white; font-size: 1rem; outline: none; margin-bottom: 1rem;
    }

    .btn-apple-style {
      background: var(--accent); color: white; border: none; padding: 14px; border-radius: 14px;
      width: 100%; font-weight: 600; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    }

    #app { display: flex; width: 100%; height: 100vh; z-index: 1; padding: 15px; gap: 15px; flex-direction: column; }
    @media (min-width: 768px) { #app { flex-direction: row; } }

    aside {
      background: var(--glass-bg); backdrop-filter: blur(30px); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 1.2rem; display: flex; flex-direction: column; gap: 10px;
    }

    nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }

    .nav-btn {
      background: transparent; border: none; color: var(--text-sub); padding: 10px 14px;
      border-radius: 12px; font-size: 0.9rem; cursor: pointer; whitespace: nowrap;
    }
    .nav-btn.active { background: var(--glass-bg-hover); color: white; border: 1px solid rgba(255, 255, 255, 0.2); }

    main {
      flex: 1; background: var(--glass-bg); backdrop-filter: blur(30px); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 1.5rem; overflow-y: auto;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .twister-card { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-border); border-radius: 20px; padding: 1.5rem; text-align: center; }
    .twister-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 1rem; }
    .twister-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid var(--glass-border); color: white; padding: 12px; border-radius: 12px; cursor: pointer; }

    #player-container { display: none; margin-top: 1rem; }
    #emulator-iframe { width: 100%; height: 400px; border: none; border-radius: 12px; }
  </style>
</head>
<body>

  <div class="bg-shape shape1"></div>
  <div class="bg-shape shape2"></div>

  <!-- MODAL DE LOGIN -->
  <div id="modal-login" class="modal-overlay">
    <div class="glass-card">
      <h2 style="margin-bottom:10px;">📦 BoxCloud</h2>
      <p style="color:var(--text-sub); margin-bottom:20px;">Acesse seus jogos, aprendizado e nuvem de 5TB.</p>
      
      <input type="email" id="email-input" class="glass-input" placeholder="Seu e-mail (opcional)" />
      <input type="password" id="pass-input" class="glass-input" placeholder="Sua senha (opcional)" />
      
      <button class="btn-apple-style" onclick="entrarDireto()">Entrar no Sistema</button>
    </div>
  </div>

  <!-- APP PRINCIPAL -->
  <div id="app">
    <aside>
      <div style="font-weight:bold; font-size:1.2rem;">📦 BoxCloud</div>
      <nav>
        <button class="nav-btn active" onclick="switchTab('cloud', this)">📁 Cloud</button>
        <button class="nav-btn" onclick="switchTab('twister', this)">🌪️ BoxTwister</button>
        <button class="nav-btn" onclick="switchTab('play', this)">🎮 PlayBox</button>
      </nav>
    </aside>

    <main>
      <!-- Aba Cloud -->
      <section id="tab-cloud" class="tab-content active">
        <h2>Armazenamento BoxCloud (5TB)</h2>
        <p style="color:var(--text-sub); margin-top:10px;">⚡ AutoSave do BoxCloudSaving: ATIVADO</p>
      </section>

      <!-- Aba BoxTwister -->
      <section id="tab-twister" class="tab-content">
        <h2>BoxTwister 🌪️</h2>
        <br>
        <div class="twister-card">
          <h3>Como se diz "Maçã" em Inglês?</h3>
          <div class="twister-options">
            <button class="twister-btn" onclick="alert('Incorreto!')">Water</button>
            <button class="twister-btn" onclick="alert('Correto! Salvando progresso no BoxCloudSaving...')">Apple</button>
          </div>
        </div>
      </section>

      <!-- Aba PlayBox -->
      <section id="tab-play" class="tab-content">
        <h2>PlayBox (Netplay Online)</h2>
        <br>
        <button class="btn-apple-style" onclick="abrirJogo('nes')">Jogar NES Online</button>
        <div id="player-container">
          <iframe id="emulator-iframe"></iframe>
        </div>
      </section>
    </main>
  </div>

  <script>
    // Função para forçar o fechamento da tela de login
    function entrarDireto() {
      const modal = document.getElementById('modal-login');
      if (modal) {
        modal.style.display = 'none';
      }
    }

    function switchTab(tabName, btn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');
      if(btn) btn.classList.add('active');
    }

    function abrirJogo(system) {
      const container = document.getElementById('player-container');
      const iframe = document.getElementById('emulator-iframe');
      container.style.display = 'block';
      iframe.srcdoc = `
        <html><body style="margin:0;background:#000;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;">
          <h3>Conectando aos Servidores Netplay...</h3>
        </body></html>
      `;
    }
  </script>
</body>
</html>
